name: Dashboard

# Builds the setups dashboard (python dashboard.py) and publishes it with GitHub Pages.
# - Every 30 minutes through the US session, so the latest prices move during the day.
#   Rules still only see completed daily candles; nothing new is a signal until the close.
# - Again after each Daily scan, so the page picks up the signals it just logged.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
on:
  schedule:
    - cron: "7,37 13-21 * * 1-5"   # 13:07-21:37 UTC covers 9:30 AM-4:37 PM ET in both EST and EDT
  workflow_run:
    workflows: ["Daily scan"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DATA_PROVIDER: ${{ secrets.DATA_PROVIDER || 'alpaca' }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build
        run: |
          {
            echo "## Dashboard build ($(TZ=America/New_York date '+%a %Y-%m-%d %H:%M ET'))"
            echo '```'
            python dashboard.py --out site 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test -s site/index.html     # a failed build keeps the last published page
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
