name: Build universe

# Actions -> Build universe -> Run workflow. Rebuilds universe_smallcap.txt (S&P SmallCap 600,
# minus tickers already used) and commits it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt lxml
      - run: python -m tools.build_smallcap_universe | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add universe_smallcap.txt
          git diff --cached --quiet || git commit -m "Build universe_smallcap.txt (S&P SmallCap 600 holdout)"
          git push
