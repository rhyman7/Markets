name: Daily scan

# Runs automatically after the US market close on weekdays, or on demand from the Actions tab.
on:
  schedule:
    - cron: "37 21 * * 1-5"   # 21:37 UTC = 4:37 PM EST / 5:37 PM EDT
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_PROVIDER: ${{ secrets.DATA_PROVIDER }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan
        run: |
          {
            echo "## Fibonacci pullback scan ($(TZ=America/New_York date '+%a %Y-%m-%d %H:%M ET'))"
            echo "Completed daily bars only. Not a recommendation to trade."
            echo '```'
            python scan.py 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: scan
          path: output/
          if-no-files-found: ignore
