name: Backtest

# Run from the Actions tab: Backtest -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history"
        default: "10"
      split:
        description: "Also compare trades before/after this date (YYYY-MM-DD, blank to skip)"
        default: "2021-01-01"
      tickers:
        description: "Tickers separated by spaces (blank = universe.txt)"
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_PROVIDER: ${{ secrets.DATA_PROVIDER || 'alpaca' }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run backtests
        run: |
          ARGS="--years ${{ inputs.years }}"
          [ -n "${{ inputs.split }}" ] && ARGS="$ARGS --split ${{ inputs.split }}"
          [ -n "${{ inputs.tickers }}" ] && ARGS="$ARGS --tickers ${{ inputs.tickers }}"
          {
            echo "## Backtest results ($(date -u +%Y-%m-%d))"
            for s in fib_pullback trend_baseline; do
              echo; echo "### $s"; echo '```'
              python backtest.py --strategy $s $ARGS 2>&1
              echo '```'
            done
            echo
            echo "fib_pullback only has an edge if it beats trend_baseline (random entries in the same uptrends)."
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-trades
          path: output/
          if-no-files-found: ignore
